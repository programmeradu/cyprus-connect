name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify (typecheck, test, audit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci --prefer-offline
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests with coverage floor
        run: npm run test:coverage
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Next.js
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://vuneli.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://vuneli.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_LOGO_DEV_KEY: ${{ secrets.NEXT_PUBLIC_LOGO_DEV_KEY }}
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_PRO_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_CREDITS_100_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_CREDITS_100_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_CREDITS_500_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_CREDITS_500_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_CREDITS_1000_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_CREDITS_1000_PRICE_ID }}
        run: npm run build

      - name: Build OpenNext bundle
        run: |
          npx opennextjs-cloudflare build --skipNextBuild
          node scripts/inject-scheduled-handler.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
