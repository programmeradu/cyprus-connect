name: Grant Alerts Cron

on:
  schedule:
    # Every hour on the hour.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger grant-alerts scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          SECRET="${CRON_SECRET:-vuneli-cron-grant-alerts-2026-cy}"
          URL="https://vuneli.com/api/cron/grant-alerts?secret=${SECRET}"
          echo "Triggering grant-alerts scan"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "$URL")
          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Grant alerts cron failed"
            exit 1
          fi
