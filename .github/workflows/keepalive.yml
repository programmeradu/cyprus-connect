name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 09:00 UTC. Supabase free-tier pauses at 7 days idle;
    # day-of-month step syntax (e.g. */6) resets at month boundaries and can
    # produce gaps >7 days, so we use a plain day-of-week schedule instead.
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          set -e
          URL="https://vuneli.com/api/keep-alive"
          echo "Pinging $URL"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" "$URL")
          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Keep-alive ping failed"
            exit 1
          fi
